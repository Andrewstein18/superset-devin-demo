name: Tech Debt Scanner

on:
  schedule:
    - cron: '0 8 * * 0'  # Sundays 8am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scan only — no fixer agents'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  scan:
    name: Run Tech Debt Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run tech debt scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVIN_API_TOKEN: ${{ secrets.DEVIN_API_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -m scripts.tech_debt_scanner.orchestrator $ARGS
