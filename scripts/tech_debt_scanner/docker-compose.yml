version: "3.8"

services:
  tech-debt-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DEVIN_API_TOKEN=${DEVIN_API_TOKEN}
    volumes:
      - ./reports:/app/reports
    # Default: full pipeline. Override with --dry-run for scan-only.
    # command: ["--dry-run"]
